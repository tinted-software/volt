name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Check no_std, bare-metal, and C ABI symbols
        run: |
          ./scripts/check-nostd.sh
          ./scripts/check-baremetal.sh
          ./scripts/check-symbols.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Setup Mold Linker
        uses: rui314/setup-mold@v1
      - name: Run tests with nextest
        run: mold -run cargo nextest run --no-fail-fast --workspace --all-features
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Setup Mold Linker
        uses: rui314/setup-mold@v1
      - name: cargo fmt
        run: mold -run cargo fmt --all --check
      - name: Run lint
        run: mold -run cargo clippy --workspace --all-features -- -D warnings
